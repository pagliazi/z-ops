[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zops-companion"
version = "2.0.2"
license = "Apache-2.0"
description = "用户态主动 WSS Companion；测试版，非生产安装包"
requires-python = ">=3.11"
dependencies = [
  "websockets==15.0.1",
  "aiohttp==3.13.1",
  "cryptography==46.0.3",
  "keyring==25.6.0",
  "psutil==7.1.2",
  "playwright==1.56.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "pypdf==6.1.3",
  "Pillow==12.0.0",
  "pywin32==311; sys_platform == 'win32'",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32' or sys_platform == 'linux'",
  "python-xlib==0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
zops-companion = "companion.__main__:main"
zops-companion-native = "companion.native_host:main"

[tool.setuptools]
packages = ["companion"]
package-dir = {companion = "."}

[tool.setuptools.package-data]
companion = ["*.js", "*.spec"]
