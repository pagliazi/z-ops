// ═══ Markdown 渲染 ═══
try { marked.setOptions({ breaks: true, gfm: true }); } catch(e) {}

function renderMarkdown(text) {
    if (!text) return '';
    try {
        // 提取 <think>...</think> 思考过程
        let thinkHtml = '';
        let mainText = text;
        const thinkRegex = /<think>([\s\S]*?)<\/think>/gi;
        const thinks = [];
        let match;
        while ((match = thinkRegex.exec(text)) !== null) {
            thinks.push(match[1].trim());
        }
        if (thinks.length > 0) {
            mainText = text.replace(thinkRegex, '').trim();
            const thinkContent = thinks.join('\n\n');
            thinkHtml = '<details class="think-block"><summary><i class="ri-lightbulb-line"></i> 思考过程</summary><div class="think-content">' + thinkContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') + '</div></details>';
        }
        const bodyHtml = marked.parse(mainText);
        return thinkHtml + bodyHtml;
    } catch(e) {
        console.error('[Z-OPS] markdown parse error:', e);
        return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }
}

function MarkdownContent({ content, className }) {
    const html = useMemo(() => renderMarkdown(content), [content]);
    return React.createElement('div', { className, dangerouslySetInnerHTML: { __html: html } });
}

// ═══ API ═══
const API = {
    token: localStorage.getItem('zops_token') || '',
    headers() {
        const h = { 'Content-Type': 'application/json' };
        if (this.token) h['Authorization'] = `Bearer ${this.token}`;
        return h;
    },
    async get(path) {
        const r = await fetch(path, { headers: this.headers() });
        if (r.status === 401) { this.logout(); window.location.reload(); throw new Error('登录已过期，请重新登录'); }
        // P0: 非 2xx 显式抛错 (带 status) — 403 归属拒绝不得被静默吞掉或经恢复接口重试绕过
        if (!r.ok) {
            let detail = '';
            try { detail = (await r.clone().json()).detail || ''; } catch (_) {}
            const err = new Error(detail || ('HTTP ' + r.status));
            err.status = r.status;
            throw err;
        }
        return r.json();
    },
    async post(path, body) {
        const r = await fetch(path, { method: 'POST', headers: this.headers(), body: JSON.stringify(body) });
        if (r.status === 401) { this.logout(); window.location.reload(); throw new Error('登录已过期，请重新登录'); }
        return r;
    },
    async put(path, body) {
        const r = await fetch(path, { method: 'PUT', headers: this.headers(), body: JSON.stringify(body) });
        if (r.status === 401) { this.logout(); window.location.reload(); throw new Error('登录已过期，请重新登录'); }
        return r;
    },
    async del(path) {
        const r = await fetch(path, { method: 'DELETE', headers: this.headers() });
        if (r.status === 401) { this.logout(); window.location.reload(); throw new Error('登录已过期，请重新登录'); }
        return r;
    },
    setToken(t) { this.token = t; localStorage.setItem('zops_token', t); },
    logout() { this.token = ''; localStorage.removeItem('zops_token'); localStorage.removeItem('zops_user'); }
};

function StatusDot({ status }) {
    const c = { online: 'bg-green-500', offline: 'bg-red-400', timeout: 'bg-yellow-400', unknown: 'bg-gray-300' };
    return <span className={`inline-block w-2 h-2 rounded-full ${c[status] || c.unknown}`} />;
}

// ═══ 登录页 ═══
function LoginPage({ onLogin }) {
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    const [authType, setAuthType] = useState('ldap'); // 默认 LDAP
    const [ldapEnabled, setLdapEnabled] = useState(true);

    useEffect(() => {
        fetch('/api/auth/ldap-status').then(r => r.json()).then(d => {
            setLdapEnabled(d.ldap_enabled);
            if (!d.ldap_enabled) setAuthType('local');
        }).catch(() => {});
    }, []);

    const submit = async (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, auth_type: authType })
            });
            const d = await r.json();
            if (r.ok && d.token) {
                API.setToken(d.token);
                localStorage.setItem('zops_user', JSON.stringify({ username: d.username, display_name: d.display_name, role: d.role }));
                onLogin(d);
            } else {
                // AD 未授权 → 特殊提示
                if (authType === 'ldap' && r.status === 403) {
                    setError('您的账号尚未被授权访问智OC，请联系管理员审批');
                } else {
                    setError(d.detail || '登录失败');
                }
            }
        } catch(e) { setError('网络错误'); }
        setLoading(false);
    };

    return (
        <div className="min-h-screen flex items-center justify-center bg-gray-50">
            <div className="w-full max-w-sm">
                <div className="text-center mb-8">
                    <div className="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4 shadow-lg">智</div>
                    <h1 className="text-2xl font-bold text-gray-900">智OC</h1>
                    <p className="text-gray-400 text-sm mt-1">Operation Claw · 智能运维平台</p>
                </div>
                <form onSubmit={submit} className="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                    {ldapEnabled && (
                        <div className="flex mb-5 bg-gray-100 rounded-lg p-1">
                            <button type="button" onClick={() => setAuthType('ldap')}
                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${authType === 'ldap' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                <i className="ri-shield-keyhole-line mr-1" />AD 域账号
                            </button>
                            <button type="button" onClick={() => setAuthType('local')}
                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${authType === 'local' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                <i className="ri-user-line mr-1" />本地账号
                            </button>
                        </div>
                    )}
                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1.5">
                            {authType === 'ldap' ? 'AD 域账号' : '用户名'}
                        </label>
                        <input type="text" value={username} onChange={e => setUsername(e.target.value)} autoFocus
                            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder={authType === 'ldap' ? '输入 AD 域账号 (如 zhangsan)' : '输入用户名'} />
                    </div>
                    <div className="mb-5">
                        <label className="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                        <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                            className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder={authType === 'ldap' ? '输入 AD 域密码' : '输入密码'} />
                    </div>
                    {error && (
                        <div className={`text-sm mb-3 flex items-start gap-2 p-3 rounded-lg ${error.includes('未授权') ? 'bg-yellow-50 text-yellow-700 border border-yellow-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                            <i className={error.includes('未授权') ? 'ri-shield-keyhole-line' : 'ri-error-warning-line'} />
                            <span>{error}</span>
                        </div>
                    )}
                    <button type="submit" disabled={loading || !username || !password}
                        className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-white py-2.5 rounded-lg font-medium text-sm transition-colors shadow-sm">
                        {loading ? '登录中...' : (authType === 'ldap' ? 'AD 域登录' : '本地登录')}
                    </button>
                    {authType === 'ldap' && (
                        <p className="text-xs text-gray-400 text-center mt-3">使用公司 AD 域账号登录，需管理员预先授权</p>
                    )}
                </form>
            </div>
        </div>
    );
}

// ═══ 对话面板 (含会话列表) ═══
function ChatPanel({ user }) {
    const [sessions, setSessions] = useState([]);
    const [activeSession, setActiveSession] = useState(null);
    const [messages, setMessages] = useState([]);
    const [input, setInput] = useState('');
    const [targetAgent, setTargetAgent] = useState('');  // '' = auto (orchestrator)
    const [loading, setLoading] = useState(false);
    const [loadingText, setLoadingText] = useState('');
    const endRef = useRef(null);
    const scroll = () => endRef.current?.scrollIntoView({ behavior: 'smooth' });
    useEffect(scroll, [messages]);

    // 加载会话列表
    const loadSessions = useCallback(() => {
        API.get('/api/chat/sessions').then(d => setSessions(d.sessions || [])).catch(() => {});
    }, []);
    useEffect(() => { loadSessions(); }, [loadSessions]);

    // 切换会话时加载消息 (v4.0 Phase 3.3: Redis meta 过期 404 时降级从持久化 transcript 重建)
    const [resumeNote, setResumeNote] = useState('');
    useEffect(() => {
        if (!activeSession) { setMessages([]); setResumeNote(''); return; }
        setResumeNote('');
        const mapMsgs = (list) => (list || []).map(m => ({
            role: m.role, content: m.content, source: m.source,
            time: new Date((m.timestamp || Date.now() / 1000) * 1000).toLocaleTimeString()
        }));
        API.get(`/api/chat/messages/${activeSession}`).then(d => {
            setMessages(mapMsgs(d.messages));
        }).catch((err) => {
            // P0: 403 = 归属校验拒绝 — 不得经 resume_context 恢复接口重试绕过
            if (err && err.status === 403) {
                setMessages([]);
                setResumeNote('无权访问该会话（归属校验拒绝）');
                return;
            }
            // Redis 会话过期/丢失 → resume_context 从 logs/sessions/{id}.jsonl 重放 (永久保留)
            API.get(`/api/sessions/${activeSession}/resume_context`).then(d => {
                if (d.source === 'jsonl' || (d.messages || []).length) {
                    setMessages(mapMsgs(d.messages));
                    if (d.source === 'jsonl') setResumeNote('会话 Redis 缓存已过期，已从持久化 transcript 完整恢复');
                } else {
                    setMessages([]);
                }
            }).catch((err2) => {
                // 恢复接口同样执行归属校验; 403/其他失败均不得回退渲染
                if (err2 && err2.status === 403) setResumeNote('无权访问该会话（归属校验拒绝）');
                setMessages([]);
            });
        });
    }, [activeSession]);

    const newSession = async () => {
        try {
            const d = await (await API.post('/api/chat/sessions', { title: '新对话' })).json();
            setActiveSession(d.session_id);
            setMessages([]);
            loadSessions();
        } catch(e) {}
    };

    const deleteSession = async (sid, e) => {
        e.stopPropagation();
        await API.del(`/api/chat/sessions/${sid}`);
        if (activeSession === sid) { setActiveSession(null); setMessages([]); }
        loadSessions();
    };

    const AGENT_OPTIONS = [
        { value: '', label: '自动', icon: 'ri-magic-line', bg: '#eff6ff', text: '#1d4ed8', border: '#bfdbfe' },
        { value: 'kb_agent', label: 'KB', icon: 'ri-book-open-line', bg: '#f5f3ff', text: '#6d28d9', border: '#ddd6fe' },
        { value: 'gcoc_agent', label: 'GCOC', icon: 'ri-database-2-line', bg: '#f0fdf4', text: '#15803d', border: '#bbf7d0' },
        { value: 'ops_agent', label: '运维', icon: 'ri-terminal-box-line', bg: '#fff7ed', text: '#c2410c', border: '#fed7aa' },
        { value: 'dev_agent', label: '脚本', icon: 'ri-code-s-slash-line', bg: '#ecfeff', text: '#0e7490', border: '#a5f3fc' },
        { value: 'general_agent', label: '通用', icon: 'ri-chat-smile-2-line', bg: '#f9fafb', text: '#4b5563', border: '#d1d5db' },
    ];
    const currentAgent = AGENT_OPTIONS.find(a => a.value === targetAgent) || AGENT_OPTIONS[0];

    const send = async () => {
        if (!input.trim() || loading) return;
        const msg = input; setInput(''); setLoading(true);
        setMessages(p => [...p, { role: 'user', content: msg, time: new Date().toLocaleTimeString() }]);

        // P1: 幂等键 (网络层重试不重复提交) + 任务事件游标 (断线补读不重新 POST)
        const idemKey = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID() : ('k' + Date.now() + Math.random().toString(16).slice(2));
        let taskId = null, lastSeq = 0, gotDone = false;

        const applyEvent = (d) => {
            if (d.seq && Number(d.seq) > lastSeq) lastSeq = Number(d.seq);
            if (d.type === 'start') {
                setLoadingText('AI 正在分析问题，请稍候...');
                if (d.task_id) taskId = d.task_id;
                if (d.session_id && !activeSession) { setActiveSession(d.session_id); loadSessions(); }
            }
            if (d.type === 'progress') setLoadingText(d.text || '处理中...');
            if (d.type === 'reply') {
                setLoadingText('');
                setMessages(p => { const u = [...p]; const l = u.length - 1;
                    const meta = {};
                    if (d.skills) meta.skills = d.skills;
                    if (d.memory_used) meta.memory_used = true;
                    if (u[l]?.role === 'assistant') u[l] = { ...u[l], content: d.text, ...meta };
                    else u.push({ role: 'assistant', content: d.text, source: d.source, time: new Date().toLocaleTimeString(), ...meta });
                    return u; });
            } else if (d.type === 'error') {
                setLoadingText('');
                setMessages(p => [...p, { role: 'error', content: d.text, time: new Date().toLocaleTimeString() }]);
            }
            if (d.type === 'done') gotDone = true;
        };

        // P1 断线补读: 按游标拉取任务事件直至终态 — 不重新提交任务
        const catchUp = async () => {
            for (let i = 0; i < 90; i++) {
                const r = await fetch(`/api/chat/tasks/${taskId}/events?after=${lastSeq}`, { headers: API.headers() });
                if (!r.ok) throw new Error('任务事件不可读 (HTTP ' + r.status + ')');
                const d = await r.json();
                for (const ev of (d.events || [])) {
                    const m = { seq: ev.seq, event_id: ev.event_id };
                    if (ev.type === 'task_started') applyEvent({ ...m, type: 'start', msg_id: ev.data?.msg_id, session_id: ev.data?.session_id });
                    else if (ev.type === 'progress') applyEvent({ ...m, type: 'progress', text: ev.data?.text, source: ev.data?.source });
                    else if (ev.type === 'delta') applyEvent({ ...m, type: 'delta' });
                    else if (ev.type === 'reply') applyEvent({ ...m, type: 'reply', text: ev.data?.text, source: ev.data?.source });
                    else if (ev.type === 'task_terminal') {
                        if (ev.data?.error) applyEvent({ ...m, type: 'error', text: ev.data.error });
                        applyEvent({ ...m, type: 'done' });
                    }
                }
                if (d.terminal || gotDone) return;
                await new Promise(res => setTimeout(res, 2000));
            }
            throw new Error('断线补读超时');
        };

        try {
            const payload = { message: msg, target: 'manager' };
            if (activeSession) payload.session_id = activeSession;
            if (targetAgent) payload.target_agent = targetAgent;
            setLoadingText(`${currentAgent.label === '自动' ? 'AI 正在分析问题' : currentAgent.label + ' 正在处理'}，请稍候...`);
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { ...API.headers(), 'Idempotency-Key': idemKey },
                body: JSON.stringify(payload),
            });
            const hdrTask = resp.headers.get('X-Task-Id');
            if (hdrTask) taskId = hdrTask;
            if (!resp.ok) {
                let detail = 'HTTP ' + resp.status;
                try { detail = (await resp.json()).detail || detail; } catch (_) {}
                throw new Error(detail);
            }
            const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
            while (true) {
                const { done, value } = await reader.read(); if (done) break;
                buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop() || '';
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    try { applyEvent(JSON.parse(line.slice(6))); } catch(e) {}
                }
            }
            // 流中断但任务未终态 (切页回来/网络闪断) → 按游标补读, 不重新提交
            if (!gotDone && taskId) { try { await catchUp(); } catch(e) { /* 保留已渲染内容 */ } }
            loadSessions();
        } catch(e) {
            if (taskId) { try { await catchUp(); } catch(_) { setMessages(p => [...p, { role: 'error', content: `请求失败: ${e.message}`, time: new Date().toLocaleTimeString() }]); } }
            else setMessages(p => [...p, { role: 'error', content: `请求失败: ${e.message}`, time: new Date().toLocaleTimeString() }]);
        }
        setLoading(false);
    };

    const relTime = (ts) => { const d = Math.floor(Date.now()/1000 - ts); return d < 60 ? '刚刚' : d < 3600 ? `${Math.floor(d/60)}分钟前` : d < 86400 ? `${Math.floor(d/3600)}小时前` : `${Math.floor(d/86400)}天前`; };

    return (

// ─── 对话内联审批操作 (v4.0 Phase 4.2: 助手消息含审批单号时管理员可直接决策) ───
function ApprovalInline({ text, onDone }) {
    const match = text.match(/审批单号[:：]\s*`?(apr_[a-z0-9]+)`?/i);
    const aid = match ? match[1] : '';
    const [state, setState] = useState('loading');  // loading | pending | approved | rejected | timeout | gone
    const [busy, setBusy] = useState(false);
    useEffect(() => {
        if (!aid) return;
        API.get(`/api/approvals/${aid}`).then(d => setState(d.status || 'pending')).catch(() => setState('gone'));
    }, [aid]);
    if (!aid) return null;
    const decide = async (decision) => {
        setBusy(true);
        try {
            const r = await API.post(`/api/approvals/${aid}/decide`, { decision });
            const d = await r.json();
            if (r.ok) {
                setState(d.decision);
                onDone && onDone(`> ✅ 管理员已${d.decision === 'approved' ? '批准' : '拒绝'}此操作 (审批单 ${aid}, 决策已写审计日志)`);
            }
        } catch (e) {}
        setBusy(false);
    };
    const badge = (icon, cls, label) => (
        <div className={`mt-2 inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-lg ${cls}`}><i className={icon} />{label}</div>
    );
    if (state === 'loading') return null;
    if (state === 'approved') return badge('ri-checkbox-circle-line', 'bg-emerald-50 text-emerald-600', '已批准 · 工具已恢复执行');
    if (state === 'rejected') return badge('ri-close-circle-line', 'bg-red-50 text-red-600', '已拒绝 · 未执行');
    if (state === 'timeout') return badge('ri-timer-flash-line', 'bg-gray-100 text-gray-500', '审批超时 · 自动拒绝');
    if (state === 'gone') return badge('ri-time-line', 'bg-gray-100 text-gray-400', '审批单已过期 (决策记录见审计日志)');
    return (
        <div className="mt-2.5 flex items-center gap-2 border-t border-gray-100 pt-2.5">
            <span className="text-[11px] text-amber-600 flex items-center gap-1"><i className="ri-shield-check-line" />等待审批</span>
            <button onClick={() => decide('reject')} disabled={busy}
                className="ml-auto px-2.5 py-1 rounded-md text-xs font-medium border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-50">拒绝</button>
            <button onClick={() => decide('approve')} disabled={busy}
                className="px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-50">{busy ? '决策中...' : '批准'}</button>
        </div>
    );
}

// ═══ 日志 (按会话分组) ═══
function LogsPanel() {
    const [logs, setLogs] = useState([]); const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
    const [filters, setFilters] = useState({ agents: [], levels: [], categories: [], sessions: [] });
    const [sessionGroups, setSessionGroups] = useState([]);
    const [fAgent, setFAgent] = useState(''); const [fLevel, setFLevel] = useState(''); const [fSession, setFSession] = useState('');
    const [kw, setKw] = useState(''); const [autoR, setAutoR] = useState(true); const [total, setTotal] = useState(0);
    const [viewMode, setViewMode] = useState('session'); // 'session' | 'list'

    const fetch_ = useCallback(() => {
        const p = new URLSearchParams({ date });
        if (fAgent) p.set('agent', fAgent); if (fLevel) p.set('level', fLevel); if (fSession) p.set('session_id', fSession); if (kw) p.set('keyword', kw);
        API.get(`/api/daily-log?${p}`).then(d => { setLogs(d.logs || []); setTotal(d.total || 0); if (d.filters) setFilters(d.filters); setSessionGroups(d.session_groups || []); }).catch(() => {});
    }, [date, fAgent, fLevel, fSession, kw]);
    useEffect(() => { fetch_(); }, [fetch_]);
    useEffect(() => { if (!autoR) return; const t = setInterval(fetch_, 5000); return () => clearInterval(t); }, [autoR, fetch_]);

    const lvlStyle = { info: 'border-blue-200 bg-blue-50 text-blue-700', success: 'border-green-200 bg-green-50 text-green-700', warn: 'border-yellow-200 bg-yellow-50 text-yellow-700', error: 'border-red-200 bg-red-50 text-red-700' };
    const lvlIcon = { info: 'ri-information-line', success: 'ri-check-line', warn: 'ri-alert-line', error: 'ri-close-circle-line' };
    const catIcon = { chat: 'ri-chat-3-line', llm: 'ri-brain-line', route: 'ri-route-line', system: 'ri-settings-3-line', kb: 'ri-book-open-line', sanitize: 'ri-shield-keyhole-line' };
    const chip = (active) => `px-2.5 py-1 rounded-full text-xs cursor-pointer transition-all border ${active ? 'bg-blue-50 border-blue-300 text-blue-700 font-medium' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-300'}`;
    const relTime = (ts) => { const d = Math.floor(Date.now()/1000 - ts); return d < 60 ? `${d}秒前` : d < 3600 ? `${Math.floor(d/60)}分钟前` : new Date(ts*1000).toLocaleTimeString(); };
    const qaDetail = (log) => (log.question || log.answer) ? (
        <details className="mt-1.5 ml-5 border-t border-dashed border-gray-200 pt-1.5">
            <summary className="text-[10px] text-gray-400 cursor-pointer select-none hover:text-blue-500"><i className="ri-chat-quote-line mr-0.5" />完整问答记录</summary>
            <div className="mt-1.5 space-y-1.5">
                {log.question && <div className="text-xs bg-white/60 rounded-md px-2 py-1.5"><span className="font-semibold text-blue-600">问：</span><span className="text-gray-700 whitespace-pre-wrap break-words">{log.question}</span></div>}
                {log.answer && <div className="text-xs bg-white/60 rounded-md px-2 py-1.5"><span className="font-semibold text-green-600">答：</span><span className="text-gray-700 whitespace-pre-wrap break-words">{log.answer}</span></div>}
            </div>
        </details>
    ) : null;

    return (
        <div className="p-6 h-full flex flex-col">
            <div className="flex items-center justify-between mb-4">
                <div><h2 className="text-gray-900 font-semibold text-lg">运维日志</h2>
                    <p className="text-gray-400 text-sm">{logs.length}{total > logs.length ? ` / ${total}` : ''} 条记录，{sessionGroups.length} 个会话</p></div>
                <div className="flex items-center gap-2.5">
                    <div className="flex bg-gray-100 rounded-lg p-0.5">
                        <button onClick={() => setViewMode('session')} className={`px-2.5 py-1 rounded-md text-xs transition-all ${viewMode==='session' ? 'bg-white text-gray-800 shadow-sm font-medium' : 'text-gray-500'}`}>会话</button>
                        <button onClick={() => setViewMode('list')} className={`px-2.5 py-1 rounded-md text-xs transition-all ${viewMode==='list' ? 'bg-white text-gray-800 shadow-sm font-medium' : 'text-gray-500'}`}>列表</button>
                    </div>
                    <button onClick={() => setAutoR(!autoR)} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border transition-all ${autoR ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-400'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${autoR ? 'bg-green-500 animate-pulse' : 'bg-gray-300'}`} />{autoR ? '自动刷新' : '已暂停'}
                    </button>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-sm text-gray-700" />
                </div>
            </div>
            <div className="flex flex-wrap gap-1.5 mb-4">
                <div className="relative mr-2">
                    <i className="ri-search-line absolute left-2.5 top-2 text-gray-400 text-xs" />
                    <input type="text" placeholder="搜索..." value={kw} onChange={e => setKw(e.target.value)} className="bg-white border border-gray-200 rounded-lg pl-7 pr-3 py-1.5 text-xs text-gray-700 w-36 focus:outline-none focus:ring-1 focus:ring-blue-400" />
                </div>
                <span onClick={() => setFAgent('')} className={chip(!fAgent)}>全部</span>
                {filters.agents.map(a => <span key={a} onClick={() => setFAgent(fAgent===a?'':a)} className={chip(fAgent===a)}>{a.replace('_agent','')}</span>)}
                <span className="text-gray-200 mx-0.5">|</span>
                {['info','success','warn','error'].map(l => <span key={l} onClick={() => setFLevel(fLevel===l?'':l)} className={chip(fLevel===l)}><i className={`${lvlIcon[l]} mr-0.5`}/>{l}</span>)}
            </div>
            <div className="flex-1 overflow-y-auto space-y-2">
                {viewMode === 'session' ? (
                    sessionGroups.length > 0 ? sessionGroups.map(sg => (
                        <div key={sg.session_id} className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                            <div onClick={() => setFSession(fSession === sg.session_id ? '' : sg.session_id)}
                                className="px-4 py-3 flex items-center gap-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <i className={`ri-chat-3-line text-blue-400`} />
                                <div className="flex-1 min-w-0">
                                    <div className="text-sm font-medium text-gray-800 truncate">{sg.preview}</div>
                                    <div className="text-[10px] text-gray-400 mt-0.5">会话 {sg.session_id} · {sg.count} 条日志 · {sg.agents.join(', ')}</div>
                                </div>
                                <span className="text-xs text-gray-400">{relTime(sg.last_time)}</span>
                                <i className={`ri-arrow-${fSession === sg.session_id ? 'up' : 'down'}-s-line text-gray-400`} />
                            </div>
                            {fSession === sg.session_id && (
                                <div className="border-t border-gray-100 px-4 py-2 space-y-1.5 bg-gray-50">
                                    {logs.filter(l => l.session_id === sg.session_id).map((log, i) => { const lv = log.level || 'info'; const cat = log.category || '';
                                        return (<div key={i} className={`rounded-lg px-3 py-2 text-sm border ${lvlStyle[lv] || lvlStyle.info}`}>
                                            <div className="flex items-center gap-2">
                                                <i className={`${lvlIcon[lv]} text-xs`} /><span className="font-medium text-xs">{log.agent}</span>
                                                {cat && <span className="text-[10px] bg-white/70 text-gray-500 px-1.5 py-0.5 rounded"><i className={`${catIcon[cat] || 'ri-folder-line'} mr-0.5`}/>{cat}</span>}
                                                {log.model && <span className="text-[10px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded"><i className="ri-cpu-line mr-0.5" />{log.model}</span>}
                                                {log.username && <span className="text-[10px] text-gray-400"><i className="ri-user-line mr-0.5" />{log.username}</span>}
                                                <span className="text-[10px] text-gray-400 ml-auto">{relTime(log.timestamp)}</span>
                                            </div>
                                            <div className="text-gray-800 text-xs pl-5 mt-0.5">{log.content}</div>
                                            {qaDetail(log)}
                                        </div>); })}
                                </div>
                            )}
                        </div>
                    )) : (
                        logs.filter(l => !l.session_id).length > 0 ? logs.filter(l => !l.session_id).map((log, i) => {
                            const lv = log.level || 'info'; const cat = log.category || '';
                            return (<div key={i} className={`rounded-lg px-4 py-3 text-sm border ${lvlStyle[lv] || lvlStyle.info}`}>
                                <div className="flex items-center gap-2 mb-1"><i className={`${lvlIcon[lv]} text-xs`} /><span className="font-medium text-xs">{log.agent}</span>
                                    {cat && <span className="text-[10px] bg-white/70 text-gray-500 px-1.5 py-0.5 rounded">{cat}</span>}
                                    <span className="text-[10px] text-gray-400 ml-auto">{relTime(log.timestamp)}</span></div>
                                <div className="text-gray-800 text-sm pl-5">{log.content}</div>
                                {qaDetail(log)}
                            </div>);
                        }) : <div className="text-center text-gray-400 py-16"><i className="ri-file-list-3-line text-4xl block mb-3 text-gray-300" /><p>暂无日志记录</p></div>
                    )
                ) : (
                    logs.map((log, i) => { const lv = log.level || 'info'; const cat = log.category || '';
                        return (<div key={i} className={`rounded-lg px-4 py-3 text-sm border ${lvlStyle[lv] || lvlStyle.info}`}>
                            <div className="flex items-center gap-2 mb-1">
                                <i className={`${lvlIcon[lv]} text-xs`} /><span className="font-medium text-xs">{log.agent}</span>
                                {cat && <span className="text-[10px] bg-white/70 text-gray-500 px-1.5 py-0.5 rounded"><i className={`${catIcon[cat] || 'ri-folder-line'} mr-0.5`}/>{cat}</span>}
                                {log.model && <span className="text-[10px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded"><i className="ri-cpu-line mr-0.5" />{log.model}</span>}
                                {log.username && <span className="text-[10px] text-gray-400"><i className="ri-user-line mr-0.5" />{log.username}</span>}
                                {log.session_id && <span className="text-[10px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded"><i className="ri-chat-3-line mr-0.5" />{log.session_id.slice(0,8)}</span>}
                                <span className="text-[10px] text-gray-400 ml-auto">{relTime(log.timestamp)}</span>
                            </div>
                            <div className="text-gray-800 text-sm pl-5">{log.content}</div>
                            {qaDetail(log)}
                        </div>); })
                )}
                {logs.length === 0 && viewMode === 'list' && <div className="text-center text-gray-400 py-16"><i className="ri-file-list-3-line text-4xl block mb-3 text-gray-300" /><p>暂无日志记录</p></div>}
            </div>
        </div>
    );
}

// ═══ 用量 ═══
function UsagePanel() {
    const [usage, setUsage] = useState({ records: [], count: 0, total_elapsed: 0 });
    useEffect(() => { API.get('/api/usage?limit=50').then(setUsage).catch(() => {}); }, []);
    // v4.0 Phase 6: trace_id 全链查询 (msg_id → 路由 → agent → tool call 一个 ID 聚合)
    const [traceId, setTraceId] = useState('');
    const [trace, setTrace] = useState(null);
    const [traceBusy, setTraceBusy] = useState(false);
    const searchTrace = async (e) => {
        e.preventDefault();
        const q = traceId.trim();
        if (!q) { setTrace(null); return; }
        setTraceBusy(true);
        try {
            setTrace(await API.get(`/api/observability/executions?trace_id=${encodeURIComponent(q)}&limit=50`));
        } catch (err) { setTrace({ error: err.message }); }
        setTraceBusy(false);
    };
    const stats = [
        { label: '总调用', value: usage.count, color: 'text-blue-600', bg: 'bg-blue-50', icon: 'ri-chat-check-line' },
        { label: '总耗时', value: `${usage.total_elapsed}s`, color: 'text-green-600', bg: 'bg-green-50', icon: 'ri-time-line' },
        { label: '平均耗时', value: `${usage.count > 0 ? (usage.total_elapsed / usage.count).toFixed(1) : 0}s`, color: 'text-purple-600', bg: 'bg-purple-50', icon: 'ri-speed-line' },
        { label: '脱敏次数', value: usage.records.reduce((s, r) => s + (r.sanitized || 0), 0), color: 'text-yellow-600', bg: 'bg-yellow-50', icon: 'ri-shield-keyhole-line' },
    ];
    return (
        <div className="p-6">
            <h2 className="text-gray-900 font-semibold text-lg mb-5">LLM 用量统计</h2>
            <div className="grid grid-cols-4 gap-4 mb-6">
                {stats.map((s, i) => (<div key={i} className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                    <div className="flex items-center gap-3">
                        <div className={`w-10 h-10 ${s.bg} rounded-lg flex items-center justify-center`}><i className={`${s.icon} text-lg ${s.color}`} /></div>
                        <div><div className={`text-xl font-bold ${s.color}`}>{s.value}</div><div className="text-xs text-gray-400">{s.label}</div></div>
                    </div>
                </div>))}
            </div>
            {/* v4.0 Phase 6: trace 全链路追踪 */}
            <div className="bg-white border border-gray-200 rounded-xl mb-6 overflow-hidden">
                <div className="px-5 py-3 border-b border-gray-100 text-sm font-medium text-gray-700 flex items-center gap-2"><i className="ri-route-line text-blue-500" />全链路追踪 (trace_id)<span className="text-xs text-gray-400 font-normal">输入消息 msg_id，查看 路由→Agent→工具 全链执行</span></div>
                <form onSubmit={searchTrace} className="px-5 py-3 flex gap-2 border-b border-gray-50">
                    <input value={traceId} onChange={e => setTraceId(e.target.value)} placeholder="输入 trace_id / msg_id，如 8f3a21c9..."
                        className="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <button type="submit" disabled={traceBusy} className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white px-4 py-2 rounded-lg text-sm font-medium">{traceBusy ? '查询中...' : '追踪'}</button>
                </form>
                {trace && !trace.error && (
                    <div>
                        <div className="px-5 py-2 text-xs text-gray-400 bg-gray-50 border-b border-gray-50">
                            trace <span className="font-mono text-gray-600">{trace.trace_id}</span> · 命中 {trace.count} 条执行记录
                        </div>
                        <div className="divide-y divide-gray-50">
                            {(trace.records || []).map((r, i) => (
                                <div key={i} className="px-5 py-2.5 text-xs flex items-center gap-3">
                                    <span className="text-gray-300 w-16">#{i + 1}</span>
                                    <span className="text-gray-800 font-medium w-32 truncate">{r.agent_id || '-'}</span>
                                    <span className="font-mono text-blue-600 w-48 truncate">{r.tool_name || r.exec_type}</span>
                                    <span className="text-gray-400 flex-1 truncate">{r.input_summary || ''}</span>
                                    {r.success
                                        ? <span className="text-emerald-600"><i className="ri-checkbox-circle-line mr-0.5" />成功</span>
                                        : <span className="text-red-500" title={r.error || ''}><i className="ri-close-circle-line mr-0.5" />{r.error ? String(r.error).slice(0, 20) : '失败'}</span>}
                                    {r.latency_ms > 0 && <span className="text-gray-400 w-16 text-right">{(r.latency_ms / 1000).toFixed(2)}s</span>}
                                    <span className="text-gray-300 w-20 text-right">{r.started_at ? new Date(r.started_at * 1000).toLocaleTimeString() : ''}</span>
                                </div>
                            ))}
                            {trace.count === 0 && <div className="text-center text-gray-400 py-8 text-sm">该 trace 无执行记录 (消息可能未触发工具调用，或已超过 7 天保留期)</div>}
                        </div>
                    </div>
                )}
                {trace && trace.error && <div className="px-5 py-3 text-sm text-red-500">查询失败: {trace.error}</div>}
            </div>
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="px-5 py-3 border-b border-gray-100 text-sm font-medium text-gray-700">调用记录</div>
                <div className="divide-y divide-gray-50 max-h-[55vh] overflow-y-auto">
                    {usage.records.slice().reverse().map((r, i) => (
                        <div key={i} className="px-5 py-3 text-sm flex items-center gap-3 hover:bg-gray-50 transition-colors">
                            <span className="font-medium text-gray-800 w-28 truncate">{r.agent}</span>
                            <span className="text-gray-400 text-xs w-36 truncate">{r.provider}/{r.model}</span>
                            <span className="text-xs text-gray-500 w-20 truncate">{r.username ? <><i className="ri-user-line mr-0.5" />{r.username}</> : <span className="text-gray-300">-</span>}</span>
                            <div className="ml-auto flex items-center gap-4 text-xs text-gray-400">
                                {r.sanitized > 0 && <span className="text-yellow-600"><i className="ri-shield-keyhole-line mr-0.5" />{r.sanitized}</span>}
                                <span>{r.prompt_len}→{r.result_len}</span>
                                <span className={r.elapsed > 5 ? 'text-red-500 font-medium' : r.elapsed > 2 ? 'text-yellow-600' : 'text-green-600'}>{r.elapsed}s</span>
                                <span className="text-gray-300 w-20 text-right">{new Date(r.timestamp * 1000).toLocaleTimeString()}</span>
                            </div>
                        </div>
                    ))}
                    {usage.records.length === 0 && <div className="text-center text-gray-400 py-12">暂无调用记录</div>}
                </div>
            </div>
        </div>
    );
}

// ─── 审批面板 (v4.0 Phase 4.2: destructive 操作审批门, 与飞书卡片双路径) ───
function AdminApprovals({ user }) {
    const [data, setData] = useState({ pending: [], count: 0 });
    const [msg, setMsg] = useState('');
    const [busyId, setBusyId] = useState('');
    const [now, setNow] = useState(Date.now() / 1000);

    const load = useCallback(() => {
        API.get('/api/approvals').then(setData).catch(() => {});
    }, []);
    useEffect(() => { load(); }, [load]);
    // 挂起单存在时 10s 轮询刷新 (与倒计时同步)
    useEffect(() => {
        const t = setInterval(() => { load(); setNow(Date.now() / 1000); }, 10000);
        return () => clearInterval(t);
    }, [load]);

    const decide = async (aid, decision) => {
        if (decision === 'reject' && !window.confirm('确认拒绝该 destructive 操作?')) return;
        setBusyId(aid); setMsg('');
        try {
            const r = await API.post(`/api/approvals/${aid}/decide`, { decision });
            const d = await r.json();
            if (r.ok) {
                setMsg(`✅ 审批单 ${aid} 已${d.decision === 'approved' ? '批准 (工具将恢复执行)' : '拒绝'} (决策人: ${d.approver}, 已写审计日志)`);
                load();
            } else setMsg('决策失败: ' + (d.detail || r.status));
        } catch (e) { setMsg('决策失败: ' + e.message); }
        setBusyId('');
    };

    const pending = data.pending || [];
    return (
        <div className="max-w-3xl">
            <div className="flex items-center justify-between mb-4">
                <h3 className="text-gray-900 font-semibold text-base">destructive 操作审批</h3>
                <div className="flex items-center gap-2 text-xs text-gray-400">
                    {pending.length > 0 && <span className="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full"><span className="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse" />{pending.length} 项待决策</span>}
                    <span>10s 自动刷新</span>
                </div>
            </div>
            <p className="text-xs text-gray-400 mb-4">vm_power 关机/重启、batch_exec、快照回滚等 destructive 级操作会在此挂起等待批准 (同飞书审批卡片双路径); 挂起窗口 10 分钟, 超时自动拒绝; 全部决策永久写入审计日志。</p>
            {msg && <div className="bg-blue-50 text-blue-700 text-sm rounded-lg px-3 py-2 mb-4">{msg}</div>}
            <div className="space-y-3">
                {pending.map(a => {
                    // 挂起窗口倒计时: 优先后端 expires_ts (与 APPROVAL_TIMEOUT 对齐), 兜底 created_ts+600;
                    // 归零后单据 Redis TTL (24h) 未到仍会在列表, 渲染为灰色"已超时待清理"态并隐藏决策按钮
                    const exp = parseFloat(a.expires_ts || 0) || (parseFloat(a.created_ts || 0) + 600);
                    const remain = Math.max(0, exp - now);
                    const expired = remain <= 0;
                    const mm = Math.floor(remain / 60), ss = Math.floor(remain % 60);
                    let params = {}; try { params = JSON.parse(a.params || '{}'); } catch (e) {}
                    return (
                        <div key={a.approval_id} className={`bg-white border rounded-xl p-5 shadow-sm ${expired ? 'border-gray-200' : 'border-amber-200'}`}>
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${expired ? 'bg-gray-100 text-gray-500' : 'bg-red-50 text-red-600'}`}><i className="ri-alert-line mr-0.5" />destructive</span>
                                    <span className={`font-semibold text-sm font-mono ${expired ? 'text-gray-400' : 'text-gray-900'}`}>{a.tool_name}</span>
                                </div>
                                {expired
                                    ? <span className="text-xs font-medium text-gray-400"><i className="ri-time-line mr-0.5" />已超时待清理 (等待方已自动拒绝)</span>
                                    : <span className={`text-xs font-medium ${remain < 120 ? 'text-red-500' : 'text-gray-400'}`}><i className="ri-timer-line mr-0.5" />{mm}:{String(ss).padStart(2, '0')} 后超时拒绝</span>}
                            </div>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1.5 text-xs mb-3">
                                <div className="text-gray-400">发起人<span className={`${expired ? 'text-gray-500' : 'text-gray-700'} ml-1.5`}>{a.username || '-'}</span></div>
                                <div className="text-gray-400">Agent<span className={`${expired ? 'text-gray-500' : 'text-gray-700'} ml-1.5`}>{a.agent || '-'}</span></div>
                                <div className="text-gray-400 col-span-2 truncate">参数<span className={`${expired ? 'text-gray-500' : 'text-gray-700'} ml-1.5 font-mono`}>{a.params}</span></div>
                            </div>
                            <div className={`text-xs rounded-lg px-3 py-2 mb-3 ${expired ? 'bg-gray-50 text-gray-500' : 'bg-amber-50 text-amber-700'}`}><i className="ri-error-warning-line mr-1" />{a.risk_note}</div>
                            <div className="flex items-center justify-between">
                                <span className="text-[10px] text-gray-300 font-mono">{a.approval_id}</span>
                                {!expired && (
                                    <div className="flex gap-2">
                                        <button onClick={() => decide(a.approval_id, 'reject')} disabled={busyId === a.approval_id}
                                            className="px-3 py-1.5 rounded-lg text-xs font-medium border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-50">
                                            <i className="ri-close-circle-line mr-0.5" />拒绝</button>
                                        <button onClick={() => decide(a.approval_id, 'approve')} disabled={busyId === a.approval_id}
                                            className="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-50">
                                            <i className="ri-checkbox-circle-line mr-0.5" />{busyId === a.approval_id ? '决策中...' : '批准执行'}</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                })}
                {pending.length === 0 && (
                    <div className="text-center py-16 text-gray-400">
                        <i className="ri-shield-check-line text-4xl text-gray-200 block mb-3" />
                        <p className="text-sm">暂无挂起审批</p>
                        <p className="text-xs mt-1">destructive 操作触发时将在此与飞书同步出现</p>
                    </div>
                )}
            </div>
        </div>
    );
}

// ─── 记忆面板 (v4.0 Phase 3.2: wiki 页面计数 + 最近合成 + 用户可控删除) ───
function AdminMemory() {
    const [data, setData] = useState(null);
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState('');

    const load = useCallback(() => {
        API.get('/api/admin/memory').then(setData).catch(() => {});
    }, []);
    useEffect(() => { load(); }, [load]);

    const doSynth = async () => {
        setBusy(true); setMsg('');
        try {
            const r = await API.post('/api/admin/memory/synthesize', {});
            const d = await r.json();
            const s = d.stats || {};
            setMsg(`合成完成: 扫描 ${s.sessions || 0} 个会话 / ${s.messages || 0} 条消息, 提炼 ${s.extracted || 0} 条长期记忆`);
            load();
        } catch (e) { setMsg('合成失败: ' + e.message); }
        setBusy(false);
    };
    const doDelete = async (pt, pid, title) => {
        if (!window.confirm(`删除记忆「${title}」? 此操作写入审计日志。`)) return;
        const r = await API.del(`/api/admin/memory/${encodeURIComponent(pt)}/${encodeURIComponent(pid)}`);
        if (r.ok) { setMsg(`已删除: ${title}`); load(); } else setMsg('删除失败');
    };

    if (!data) return <div className="text-gray-400 text-sm">加载中...</div>;
    const cnt = data.counts || {};
    const typeLabel = { entities: '实体', concepts: '概念', summaries: '摘要', synthesis: '综合', queries: '查询' };
    const renderItem = (it) => (
        <div key={it.page_type + '/' + it.page_id} className="flex items-center gap-2 text-sm bg-gray-50 rounded-lg px-3 py-2">
            <i className={(it.tags || []).includes('explicit-memory') ? 'ri-user-voice-line text-green-500' : 'ri-lightbulb-line text-amber-500'} />
            <div className="min-w-0 flex-1">
                <div className="truncate text-gray-800">{it.title}</div>
                <div className="text-xs text-gray-400">{typeLabel[it.page_type] || it.page_type} · {(it.updated || '').slice(0, 19)}</div>
            </div>
            <button onClick={() => doDelete(it.page_type, it.page_id, it.title)}
                className="text-gray-300 hover:text-red-400 shrink-0" title="删除"><i className="ri-delete-bin-line" /></button>
        </div>
    );

    return (
        <div className="max-w-3xl">
            <div className="flex items-center justify-between mb-4">
                <h3 className="text-gray-900 font-semibold text-base">长期记忆</h3>
                <button onClick={doSynth} disabled={busy}
                    className="bg-blue-500 hover:bg-blue-600 disabled:opacity-50 text-white text-sm px-4 py-2 rounded-lg flex items-center gap-1.5">
                    <i className="ri-magic-line" />{busy ? '合成中...' : '立即合成'}</button>
            </div>
            <p className="text-xs text-gray-400 mb-4">每日 02:00 自动扫描近 24h 会话提炼长期记忆; 对话中发送「记住: ...」可直接写入。删除操作均记入审计日志。</p>
            {msg && <div className="bg-blue-50 text-blue-700 text-sm rounded-lg px-3 py-2 mb-4">{msg}</div>}
            <div className="grid grid-cols-5 gap-3 mb-6">
                {Object.entries(typeLabel).map(([t, label]) => (
                    <div key={t} className="bg-white border border-gray-200 rounded-xl p-4 text-center shadow-sm">
                        <div className="text-2xl font-semibold text-gray-900">{cnt[t] || 0}</div>
                        <div className="text-xs text-gray-400 mt-1">{label}</div></div>
                ))}
            </div>
            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm mb-4">
                <h4 className="text-sm font-semibold text-gray-800 mb-3">最近合成条目 <span className="text-xs text-gray-400 font-normal">(后台提炼)</span></h4>
                <div className="space-y-2">
                    {(data.recent_synthesized || []).length
                        ? data.recent_synthesized.map(renderItem)
                        : <div className="text-xs text-gray-400">暂无 — 可点击「立即合成」或等待每日 02:00 自动合成</div>}
                </div>
            </div>
            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h4 className="text-sm font-semibold text-gray-800 mb-3">用户显式记忆 <span className="text-xs text-gray-400 font-normal">(对话中「记住: ...」)</span></h4>
                <div className="space-y-2">
                    {(data.recent_explicit || []).length
                        ? data.recent_explicit.map(renderItem)
                        : <div className="text-xs text-gray-400">暂无</div>}
                </div>
            </div>
        </div>
    );
}

// ─── 审计日志 (v2.0.0 新增) ───
function AdminAudit() {
    const [entries, setEntries] = useState([]);
    const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
    const [fAgent, setFAgent] = useState('');
    const [agents, setAgents] = useState([]);
    const [stats, setStats] = useState({ count: 0, errors: 0, success_rate: 100 });
    const [autoR, setAutoR] = useState(true);

    const load = useCallback(() => {
        const p = new URLSearchParams({ date, count: '200' });
        if (fAgent) p.set('agent', fAgent);
        API.get(`/api/audit/recent?${p}`).then(d => {
            setEntries(d.entries || []);
            setAgents(d.agents || []);
            setStats({ count: d.count || 0, errors: d.errors || 0, success_rate: d.success_rate || 100 });
        }).catch(() => {});
    }, [date, fAgent]);
    useEffect(() => { load(); }, [load]);
    useEffect(() => { if (!autoR) return; const t = setInterval(load, 8000); return () => clearInterval(t); }, [autoR, load]);

    const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString('zh-CN') : '-';
    const chip = (active) => `px-2.5 py-1 rounded-full text-xs cursor-pointer transition-all border ${active ? 'bg-blue-50 border-blue-300 text-blue-700 font-medium' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-300'}`;

    return (
        <div className="max-w-4xl">
            <div className="flex items-center justify-between mb-4">
                <div><h3 className="text-gray-900 font-semibold text-base">审计日志</h3>
                    <p className="text-gray-400 text-xs mt-0.5">{stats.count} 条记录，成功率 {stats.success_rate}%，{stats.errors} 个错误</p></div>
                <div className="flex items-center gap-2">
                    <button onClick={() => setAutoR(!autoR)} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border transition-all ${autoR ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-400'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${autoR ? 'bg-green-500 animate-pulse' : 'bg-gray-300'}`} />{autoR ? '刷新中' : '已暂停'}
                    </button>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-xs text-gray-700" />
                </div>
            </div>
            {/* 统计卡片 */}
            <div className="grid grid-cols-3 gap-3 mb-4">
                <div className="bg-white border border-gray-200 rounded-xl p-3.5 shadow-sm">
                    <div className="flex items-center gap-2.5"><div className="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center"><i className="ri-file-list-3-line text-blue-500" /></div>
                    <div><div className="text-lg font-bold text-blue-600">{stats.count}</div><div className="text-[10px] text-gray-400">总操作</div></div></div></div>
                <div className="bg-white border border-gray-200 rounded-xl p-3.5 shadow-sm">
                    <div className="flex items-center gap-2.5"><div className="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center"><i className="ri-check-double-line text-green-500" /></div>
                    <div><div className="text-lg font-bold text-green-600">{stats.success_rate}%</div><div className="text-[10px] text-gray-400">成功率</div></div></div></div>
                <div className="bg-white border border-gray-200 rounded-xl p-3.5 shadow-sm">
                    <div className="flex items-center gap-2.5"><div className="w-8 h-8 bg-red-50 rounded-lg flex items-center justify-center"><i className="ri-error-warning-line text-red-500" /></div>
                    <div><div className="text-lg font-bold text-red-600">{stats.errors}</div><div className="text-[10px] text-gray-400">错误</div></div></div></div>
            </div>
            {/* Agent 过滤 */}
            <div className="flex flex-wrap gap-1.5 mb-4">
                <span onClick={() => setFAgent('')} className={chip(!fAgent)}>全部</span>
                {agents.filter(a => a).map(a => <span key={a} onClick={() => setFAgent(fAgent === a ? '' : a)} className={chip(fAgent === a)}>{a.replace('_agent', '')}</span>)}
            </div>
            {/* 审计记录列表 */}
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="divide-y divide-gray-50 max-h-[55vh] overflow-y-auto">
                    {entries.slice().reverse().map((e, i) => (
                        <div key={i} className={`px-4 py-3 text-sm hover:bg-gray-50 transition-colors ${!e.success ? 'bg-red-50/50' : ''}`}>
                            <div className="flex items-center gap-2 mb-1">
                                <span className={`w-1.5 h-1.5 rounded-full ${e.success ? 'bg-green-500' : 'bg-red-500'}`} />
                                <span className="font-medium text-gray-800 text-xs">{e.agent_id}</span>
                                <span className="text-gray-400 text-[10px]">·</span>
                                <span className="text-blue-600 text-xs font-mono">{e.action}</span>
                                {e.tool_name && <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">{e.tool_name}</span>}
                                {e.model && <span className="text-[10px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded"><i className="ri-cpu-line mr-0.5" />{e.model}</span>}
                                <span className="ml-auto text-[10px] text-gray-400">
                                    <i className="ri-user-line mr-0.5" />{e.username}
                                    <span className="mx-1">·</span>
                                    <i className="ri-links-line mr-0.5" />{e.channel}
                                    <span className="mx-1">·</span>
                                    {e.duration_ms > 0 && <><span className={e.duration_ms > 3000 ? 'text-red-500' : 'text-gray-400'}>{(e.duration_ms/1000).toFixed(1)}s</span><span className="mx-1">·</span></>}
                                    {fmtTime(e.timestamp)}
                                </span>
                            </div>
                            {e.result_summary && <div className="text-gray-500 text-xs pl-4 truncate">{e.result_summary}</div>}
                            {e.error && <div className="text-red-500 text-xs pl-4"><i className="ri-error-warning-line mr-0.5" />{e.error}</div>}
                        </div>
                    ))}
                    {entries.length === 0 && <div className="text-center text-gray-400 py-16"><i className="ri-file-shield-2-line text-4xl block mb-3 text-gray-300" /><p>暂无审计记录</p><p className="text-xs mt-1">当 Agent 处理消息时会自动记录</p></div>}
                </div>
            </div>
        </div>
    );
}

// ─── 用户管理 ───
function AdminUsers() {
    const [users, setUsers] = useState([]);
    const [newUser, setNewUser] = useState({ username: '', password: '', display_name: '', role: 'user' });
    const [adUser, setAdUser] = useState({ username: '', display_name: '', role: 'user' });
    const [msg, setMsg] = useState('');
    const [editingUser, setEditingUser] = useState(null);
    const [resetPwd, setResetPwd] = useState({ username: '', password: '' });

    const load = () => API.get('/api/auth/users').then(d => setUsers(d.users || [])).catch(() => {});
    useEffect(() => { load(); }, []);

    const addUser = async () => {
        if (!newUser.username || !newUser.password) return;
        try {
            const r = await API.post('/api/auth/register', newUser);
            if (r.ok) { setNewUser({ username: '', password: '', display_name: '', role: 'user' }); setMsg('用户已创建'); load(); }
            else { const d = await r.json(); setMsg(d.detail || '创建失败'); }
        } catch (e) { setMsg('创建失败'); }
    };

    const authorizeAd = async () => {
        if (!adUser.username) return;
        try {
            const r = await API.post('/api/auth/authorize-ad', adUser);
            const d = await r.json();
            if (r.ok) {
                setAdUser({ username: '', display_name: '', role: 'user' });
                setMsg(d.action === 'updated' ? `${d.username} 已更新授权` : `${d.username} 已授权，可用 AD 域账号登录`);
                load();
            } else { setMsg(d.detail || '授权失败'); }
        } catch (e) { setMsg('授权失败'); }
    };

    const updateRole = async (username, newRole) => {
        try {
            const r = await fetch(`/api/auth/users/${username}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API.token}` },
                body: JSON.stringify({ role: newRole })
            });
            if (r.ok) { setMsg(`${username} 角色已更新`); load(); }
            else { const d = await r.json(); setMsg(d.detail || '更新失败'); }
        } catch (e) { setMsg('更新失败'); }
    };

    const deleteUser = async (username) => {
        if (!confirm(`确认删除用户 ${username}?`)) return;
        try {
            const r = await fetch(`/api/auth/users/${username}`, {
                method: 'DELETE', headers: { 'Authorization': `Bearer ${API.token}` }
            });
            if (r.ok) { setMsg(`${username} 已删除`); load(); }
            else { const d = await r.json(); setMsg(d.detail || '删除失败'); }
        } catch (e) { setMsg('删除失败'); }
    };

    const doResetPwd = async () => {
        if (!resetPwd.username || !resetPwd.password || resetPwd.password.length < 4) { setMsg('密码至少4位'); return; }
        try {
            const r = await API.post(`/api/auth/users/${resetPwd.username}/reset-password`, { password: resetPwd.password });
            if (r.ok) { setMsg(`${resetPwd.username} 密码已重置`); setResetPwd({ username: '', password: '' }); }
            else { const d = await r.json(); setMsg(d.detail || '重置失败'); }
        } catch (e) { setMsg('重置失败'); }
    };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';
    const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleString('zh-CN') : '-';

    return (
        <div className="max-w-3xl">
            <h3 className="text-gray-900 font-semibold text-base mb-4">用户管理</h3>
            {msg && <div className="mb-3 px-3 py-2 rounded-lg bg-blue-50 text-blue-700 text-sm flex items-center justify-between">
                <span>{msg}</span><button onClick={() => setMsg('')} className="text-blue-400 hover:text-blue-600"><i className="ri-close-line" /></button></div>}

            {/* 用户列表 */}
            <div className="bg-white border border-gray-200 rounded-xl shadow-sm mb-4 overflow-hidden">
                <table className="w-full text-sm">
                    <thead><tr className="bg-gray-50 border-b border-gray-200">
                        <th className="text-left px-4 py-2.5 font-medium text-gray-600">用户</th>
                        <th className="text-left px-4 py-2.5 font-medium text-gray-600">角色</th>
                        <th className="text-left px-4 py-2.5 font-medium text-gray-600">来源</th>
                        <th className="text-left px-4 py-2.5 font-medium text-gray-600">创建时间</th>
                        <th className="text-right px-4 py-2.5 font-medium text-gray-600">操作</th>
                    </tr></thead>
                    <tbody>{users.map(u => (
                        <tr key={u.username} className="border-b border-gray-50 hover:bg-gray-50/50">
                            <td className="px-4 py-2.5">
                                <div className="flex items-center gap-2">
                                    <div className="w-7 h-7 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-xs font-bold">{(u.display_name || u.username)[0].toUpperCase()}</div>
                                    <div><div className="text-gray-800 font-medium">{u.display_name || u.username}</div><div className="text-gray-400 text-xs">@{u.username}{u.mail ? ` · ${u.mail}` : ''}</div></div>
                                </div>
                            </td>
                            <td className="px-4 py-2.5">
                                <select value={u.role} onChange={e => updateRole(u.username, e.target.value)}
                                    className="text-xs border border-gray-200 rounded px-2 py-1 bg-white">
                                    <option value="admin">管理员</option><option value="user">普通用户</option>
                                </select>
                            </td>
                            <td className="px-4 py-2.5">
                                <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${u.auth_source === 'ldap' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                    <i className={u.auth_source === 'ldap' ? 'ri-shield-keyhole-line' : 'ri-user-line'} />
                                    {u.auth_source === 'ldap' ? 'AD域' : '本地'}
                                </span>
                            </td>
                            <td className="px-4 py-2.5 text-gray-500 text-xs">{fmtTime(u.created_at)}</td>
                            <td className="px-4 py-2.5 text-right">
                                <button onClick={() => setResetPwd({ username: u.username, password: '' })} className="text-gray-400 hover:text-blue-500 mr-2" title="重置密码"><i className="ri-lock-password-line" /></button>
                                <button onClick={() => deleteUser(u.username)} className="text-gray-400 hover:text-red-500" title="删除"><i className="ri-delete-bin-line" /></button>
                            </td>
                        </tr>
                    ))}</tbody>
                </table>
            </div>

            {/* 重置密码 */}
            {resetPwd.username && (

// ─── LLM 模型配置 ───
function AdminLLM() {
    const [cfg, setCfg] = useState(null);
    const [form, setForm] = useState({ provider: '', model: '', api_key: '', base_url: '', anthropic_key: '', oneapi_key: '', oneapi_base_url: '', sanitize_enabled: true });
    const [saving, setSaving] = useState(false);
    const [msg, setMsg] = useState('');
    const [showKey, setShowKey] = useState(false);
    const [customModel, setCustomModel] = useState('');

    useEffect(() => {
        API.get('/api/llm/config').then(d => {
            setCfg(d);
            setForm({ provider: d.provider || 'deepseek', model: d.model || '', api_key: d.api_key || '', base_url: d.base_url || '', anthropic_key: d.anthropic_key || '', oneapi_key: d.oneapi_key || '', oneapi_base_url: d.oneapi_base_url || '', sanitize_enabled: d.sanitize_enabled !== false });
        }).catch(() => {});
    }, []);

    const providers = cfg?.providers || [];
    const curP = providers.find(p => p.id === form.provider);
    const models = curP?.models || [];
    const onP = (pid) => { const p = providers.find(x => x.id === pid); setForm(prev => ({ ...prev, provider: pid, model: p?.models?.[0] || '', base_url: (pid === 'custom' || pid === 'oneapi') ? prev.base_url : (p?.base_url || ''), oneapi_base_url: pid === 'oneapi' ? (prev.oneapi_base_url || p?.base_url || '') : prev.oneapi_base_url })); setCustomModel(''); };

    const save = async () => {
        setSaving(true); setMsg('');
        try {
            const payload = { ...form }; if (customModel) payload.model = customModel;
            const r = await API.post('/api/llm/config', payload);
            const d = await r.json();
            setMsg(d.status === 'ok' ? '配置已保存' : '保存失败');
        } catch (e) { setMsg('保存失败'); }
        setSaving(false);
    };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';

    return (
        <div className="max-w-2xl">
            <h3 className="text-gray-900 font-semibold text-base mb-4">LLM 模型配置</h3>
            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <div className="mb-4"><label className={lbl}>Provider</label>
                    <div className="grid grid-cols-3 gap-2">{providers.map(p => (
                        <button key={p.id} onClick={() => onP(p.id)} className={`px-3 py-2 rounded-lg text-sm border transition-all ${form.provider === p.id ? 'bg-blue-50 border-blue-300 text-blue-700 font-medium' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-300'}`}>{p.name}</button>
                    ))}</div></div>
                <div className="mb-4"><label className={lbl}>Model</label>
                    {models.length > 0 ? <div><select value={form.model} onChange={e => setForm(p => ({ ...p, model: e.target.value }))} className={inp + ' mb-2'}>{models.map(m => <option key={m} value={m}>{m}</option>)}</select>
                        <input type="text" placeholder="或输入自定义模型名..." value={customModel} onChange={e => setCustomModel(e.target.value)} className={inp} /></div>
                        : <input type="text" placeholder="输入模型名称" value={form.model} onChange={e => setForm(p => ({ ...p, model: e.target.value }))} className={inp} />}</div>
                {form.provider !== 'anthropic' && form.provider !== 'oneapi' && <div className="mb-4"><label className={lbl}>API Key</label>
                    <div className="relative"><input type={showKey ? 'text' : 'password'} placeholder={cfg?.has_api_key ? '已保存，无需重填（输入新值可覆盖）' : (cfg?.has_env_key ? '已从环境变量加载' : '输入 API Key')} value={form.api_key} onChange={e => setForm(p => ({ ...p, api_key: e.target.value }))} className={inp + ' pr-10'} />
                        <button onClick={() => setShowKey(!showKey)} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600"><i className={showKey ? 'ri-eye-off-line' : 'ri-eye-line'} /></button></div></div>}
                {form.provider === 'anthropic' && <div className="mb-4"><label className={lbl}>Anthropic API Key</label><input type="password" placeholder="sk-ant-..." value={form.anthropic_key} onChange={e => setForm(p => ({ ...p, anthropic_key: e.target.value }))} className={inp} /></div>}
                {form.provider === 'oneapi' && <div className="mb-4"><label className={lbl}>OneAPI Token</label>
                    <div className="relative"><input type={showKey ? 'text' : 'password'} placeholder={cfg?.has_oneapi_key ? '已保存，无需重填（输入新值可覆盖）' : 'sk-... (OneAPI 平台生成的 Token)'} value={form.oneapi_key} onChange={e => setForm(p => ({ ...p, oneapi_key: e.target.value }))} className={inp + ' pr-10'} />
                        <button onClick={() => setShowKey(!showKey)} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600"><i className={showKey ? 'ri-eye-off-line' : 'ri-eye-line'} /></button></div>
                    <p className="text-xs text-gray-400 mt-1"><i className="ri-information-line mr-1" />登录 OneAPI 后台创建 Token，支持按 Token 分配模型和额度</p></div>}
                {form.provider === 'oneapi' && <div className="mb-4"><label className={lbl}>OneAPI Base URL</label><input type="text" placeholder="http://127.0.0.1:3000/v1" value={form.oneapi_base_url} onChange={e => setForm(p => ({ ...p, oneapi_base_url: e.target.value }))} className={inp} />
                    <p className="text-xs text-gray-400 mt-1">支持 new-api / one-api / chat-api 等 OpenAI 兼容网关</p></div>}
                {(form.provider === 'custom' || form.provider === 'ollama') && <div className="mb-4"><label className={lbl}>Base URL</label><input type="text" placeholder="https://your-api.com/v1" value={form.base_url} onChange={e => setForm(p => ({ ...p, base_url: e.target.value }))} className={inp} /></div>}
                <div className="mb-4 flex items-center gap-3 pt-3 border-t border-gray-100">
                    <button onClick={() => setForm(p => ({ ...p, sanitize_enabled: !p.sanitize_enabled }))} className={`relative w-11 h-6 rounded-full transition-colors ${form.sanitize_enabled ? 'bg-blue-600' : 'bg-gray-300'}`}>
                        <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition-transform shadow ${form.sanitize_enabled ? 'left-[22px]' : 'left-0.5'}`} /></button>
                    <div><span className="text-sm text-gray-800 font-medium">数据脱敏</span><span className="text-xs text-gray-400 ml-2">调用前自动掩码敏感信息</span></div></div>
                <div className="flex items-center gap-3 mt-4">
                    <button onClick={save} disabled={saving} className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">{saving ? '保存中...' : '保存配置'}</button>
                    {msg && <span className={`text-sm ${msg.includes('失败') ? 'text-red-500' : 'text-green-600'}`}>{msg.includes('失败') ? '' : '✓ '}{msg}</span>}
                </div>
            </div>
        </div>
    );
}

// ─── 数据脱敏配置 ───
function AdminSanitize() {
    const [mappings, setMappings] = useState({});
    const [nmk, setNmk] = useState('');
    const [nmv, setNmv] = useState('');
    const [testText, setTestText] = useState('');
    const [testResult, setTestResult] = useState(null);

    useEffect(() => { API.get('/api/sanitize/mappings').then(d => setMappings(d.mappings || {})).catch(() => {}); }, []);

    const addMap = () => { if (!nmk.trim() || !nmv.trim()) return; const u = { ...mappings, [nmk]: nmv }; setMappings(u); API.post('/api/sanitize/mappings', { mappings: u }); setNmk(''); setNmv(''); };
    const rmMap = (k) => { const u = { ...mappings }; delete u[k]; setMappings(u); API.post('/api/sanitize/mappings', { mappings: u }); };
    const runTest = async () => { if (!testText.trim()) return; try { const r = await API.post('/api/sanitize/test', { text: testText }); setTestResult(await r.json()); } catch (e) { setTestResult({ error: e.message }); } };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';
    const lbl = 'block text-sm font-medium text-gray-700 mb-1.5';

    return (
        <div className="max-w-2xl">
            <h3 className="text-gray-900 font-semibold text-base mb-4">数据脱敏配置</h3>
            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm mb-4">
                <p className="text-xs text-gray-400 mb-4">内置规则自动识别内网IP、MAC、密码、API Key、域名、邮箱、手机号等。</p>
                <div className="mb-4"><label className={lbl}>自定义映射</label>
                    <div className="space-y-2 mb-2">{Object.entries(mappings).map(([k, v]) => (
                        <div key={k} className="flex items-center gap-2 text-sm bg-gray-50 rounded-lg px-3 py-2">
                            <code className="text-red-600">{k}</code><span className="text-gray-300">→</span><code className="text-green-600">{v}</code>
                            <button onClick={() => rmMap(k)} className="text-gray-300 hover:text-red-400 ml-auto"><i className="ri-close-line" /></button></div>))}</div>
                    <div className="flex gap-2"><input type="text" placeholder="真实值" value={nmk} onChange={e => setNmk(e.target.value)} className={inp + ' flex-1'} />
                        <input type="text" placeholder="替代值" value={nmv} onChange={e => setNmv(e.target.value)} className={inp + ' flex-1'} />
                        <button onClick={addMap} className="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm border border-gray-200"><i className="ri-add-line" /></button></div></div>
                <div><label className={lbl}>脱敏测试</label>
                    <div className="flex gap-2 mb-2"><textarea value={testText} onChange={e => setTestText(e.target.value)} placeholder="粘贴文本测试..." className={inp + ' flex-1'} rows={2} />
                        <button onClick={runTest} className="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm self-end shadow-sm font-medium">测试</button></div>
                    {testResult && !testResult.error && <div className="bg-gray-50 rounded-lg p-3 text-sm border border-gray-200">
                        <div className="text-green-600 font-medium mb-1 text-xs">{testResult.summary}</div>
                        <div className="text-gray-700 font-mono text-xs whitespace-pre-wrap">{testResult.masked_text}</div></div>}</div>
            </div>
        </div>
    );
}

// ─── API Keys ───
function AdminOneAPIKeys() {
    const [keys, setKeys] = useState([]);
    const [newName, setNewName] = useState('');
    const [creating, setCreating] = useState(false);
    const [newKey, setNewKey] = useState(null);
    const [copied, setCopied] = useState(false);

    const load = () => API.get('/api/oneapi/keys').then(d => setKeys(d.keys || [])).catch(() => {});
    useEffect(() => { load(); }, []);

    const createKey = async () => {
        if (!newName.trim()) return;
        setCreating(true);
        try {
            const r = await API.post('/api/oneapi/keys', { name: newName.trim() });
            const d = await r.json();
            if (d.key) { setNewKey(d); setNewName(''); load(); }
        } catch (e) { alert('创建失败: ' + (e.message || e)); }
        setCreating(false);
    };

    const deleteKey = async (id) => {
        if (!confirm('确认删除该 Key？删除后使用该 Key 的外部应用将无法访问。')) return;
        try { await API.del('/api/oneapi/keys/' + encodeURIComponent(id)); load(); } catch (e) {}
    };

    const copyKey = () => { navigator.clipboard.writeText(newKey.key).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }); };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';
    const port = location.port || (location.protocol === 'https:' ? '443' : '80');
