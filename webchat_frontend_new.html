<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智 OC - Operation Claw | 智能运维平台</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            -webkit-font-smoothing: antialiased;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .animate-slideIn { animation: slideIn 0.4s ease-out; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // ═══ 登录界面 ═══
        function LoginPage({ onLogin }) {
            const [authType, setAuthType] = useState('ldap');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [ldapEnabled, setLdapEnabled] = useState(false);
            
            useEffect(() => {
                fetch('/api/auth/ldap-status').then(r => r.json()).then(d => {
                    setLdapEnabled(d.ldap_enabled);
                    if (d.ldap_enabled) setAuthType('ldap');
                }).catch(() => {});
            }, []);
            
            const submit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                try {
                    const endpoint = authType === 'ldap' ? '/api/auth/ldap' : '/api/auth/login';
                    const r = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const d = await r.json();
                    
                    if (r.ok) {
                        localStorage.setItem('zops_user', JSON.stringify({
                            username: d.username,
                            display_name: d.display_name,
                            role: d.role
                        }));
                        onLogin(d);
                    } else {
                        setError(d.detail || '登录失败');
                    }
                } catch (e) {
                    setError('网络错误');
                }
                setLoading(false);
            };
            
            return (
                <div className="login-container">
                    <div className="login-box animate-slideIn">
                        <div className="text-center mb-8">
                            <div className="login-logo animate-float">
                                <i className="ri-brain-line"></i>
                            </div>
                            <h1 className="login-title">智 OC</h1>
                            <p className="login-subtitle">Operation Claw · 智能运维平台</p>
                        </div>
                        
                        <form onSubmit={submit}>
                            {ldapEnabled && (
                                <div className="flex mb-6 bg-gray-100 rounded-lg p-1">
                                    <button
                                        type="button"
                                        onClick={() => setAuthType('ldap')}
                                        className={`flex-1 py-2.5 text-sm font-medium rounded-md transition-all ${
                                            authType === 'ldap'
                                                ? 'bg-white text-blue-600 shadow-sm'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        <i className="ri-shield-keyhole-line mr-1"></i>
                                        AD 域账号
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAuthType('local')}
                                        className={`flex-1 py-2.5 text-sm font-medium rounded-md transition-all ${
                                            authType === 'local'
                                                ? 'bg-white text-blue-600 shadow-sm'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        <i className="ri-user-line mr-1"></i>
                                        本地账号
                                    </button>
                                </div>
                            )}
                            
                            <div className="input-group">
                                <label className="input-label">
                                    {authType === 'ldap' ? 'AD 域账号' : '用户名'}
                                </label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={e => setUsername(e.target.value)}
                                    className="input-field"
                                    placeholder={authType === 'ldap' ? '输入 AD 域账号' : '输入用户名'}
                                    autoFocus
                                />
                            </div>
                            
                            <div className="input-group">
                                <label className="input-label">密码</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    className="input-field"
                                    placeholder={authType === 'ldap' ? '输入 AD 域密码' : '输入密码'}
                                />
                            </div>
                            
                            {error && (
                                <div className={`mb-4 p-3 rounded-lg flex items-start gap-2 text-sm ${
                                    error.includes('未授权')
                                        ? 'bg-yellow-50 text-yellow-700 border border-yellow-200'
                                        : 'bg-red-50 text-red-700 border border-red-200'
                                }`}>
                                    <i className={error.includes('未授权') ? 'ri-shield-keyhole-line' : 'ri-error-warning-line'}></i>
                                    <span>{error}</span>
                                </div>
                            )}
                            
                            <button
                                type="submit"
                                disabled={loading || !username || !password}
                                className="btn-primary"
                            >
                                {loading ? (
                                    <span className="loading-spinner"></span>
                                ) : (
                                    authType === 'ldap' ? 'AD 域登录' : '本地登录'
                                )}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }
        
        // ═══ 主界面 ═══
        function MainApp({ user, onLogout }) {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [overview, setOverview] = useState(null);
            const messagesEndRef = useRef(null);
            
            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };
            
            useEffect(() => {
                scrollToBottom();
            }, [messages]);
            
            useEffect(() => {
                fetch('/api/overview').then(r => r.json()).then(d => setOverview(d));
            }, []);
            
            const sendMessage = async () => {
                if (!input.trim() || loading) return;
                
                const userMsg = {
                    role: 'user',
                    content: input.trim(),
                    timestamp: new Date().toISOString()
                };
                
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setLoading(true);
                
                try {
                    const r = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: input.trim() })
                    });
                    
                    if (!r.ok) throw new Error('请求失败');
                    
                    const reader = r.body.getReader();
                    const decoder = new TextDecoder();
                    
                    const assistantMsg = {
                        role: 'assistant',
                        content: '',
                        timestamp: new Date().toISOString()
                    };
                    
                    setMessages(prev => [...prev, assistantMsg]);
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.choices?.[0]?.delta?.content) {
                                        assistantMsg.content += data.choices[0].delta.content;
                                        setMessages(prev => [...prev.slice(0, -1), { ...assistantMsg }]);
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (e) {
                    const errorMsg = {
                        role: 'assistant',
                        content: '❌ 请求失败：' + e.message,
                        timestamp: new Date().toISOString(),
                        error: true
                    };
                    setMessages(prev => [...prev, errorMsg]);
                } finally {
                    setLoading(false);
                }
            };
            
            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };
            
            return (
                <div className="flex h-screen">
                    {/* 侧边栏 */}
                    <div className="sidebar w-72 flex-shrink-0">
                        <div className="sidebar-header">
                            <div className="sidebar-title">
                                <div className="w-9 h-9 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg">
                                    <i className="ri-brain-line"></i>
                                </div>
                                <span>智 OC</span>
                                <span className="sidebar-badge">v2.1</span>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4">
                            <div className="mb-6">
                                <h3 className="text-xs font-semibold text-gray-500 uppercase mb-3">系统状态</h3>
                                <div className="space-y-2">
                                    {overview && (
                                        <>
                                            <div className="flex items-center justify-between p-3 bg-green-50 rounded-lg">
                                                <span className="text-sm text-gray-700">
                                                    <i className="ri-server-line mr-2 text-green-600"></i>
                                                    Agent 在线
                                                </span>
                                                <span className="text-sm font-semibold text-green-700">
                                                    {Object.values(overview.agents || {}).filter(a => a.status === 'online').length}
                                                </span>
                                            </div>
                                            <div className="flex items-center justify-between p-3 bg-blue-50 rounded-lg">
                                                <span className="text-sm text-gray-700">
                                                    <i className="ri-brain-line mr-2 text-blue-600"></i>
                                                    模型
                                                </span>
                                                <span className="text-sm font-semibold text-blue-700">
                                                    {overview.llm_real_model || overview.llm_model || '-'}{overview.llm_model_alias && <span className="text-xs text-gray-400 ml-1">({overview.llm_model})</span>}
                                                </span>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        
                        <div className="p-4 border-t border-gray-200">
                            <div className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                        {user?.display_name?.[0]?.toUpperCase() || user?.username?.[0]?.toUpperCase()}
                                    </div>
                                    <div>
                                        <div className="text-sm font-medium text-gray-900">
                                            {user?.display_name || user?.username}
                                        </div>
                                        <div className="text-xs text-gray-500">
                                            {user?.role || 'User'}
                                        </div>
                                    </div>
                                </div>
                                <button
                                    onClick={onLogout}
                                    className="text-gray-400 hover:text-red-600 transition-colors"
                                    title="退出登录"
                                >
                                    <i className="ri-logout-box-line"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    {/* 主聊天区域 */}
                    <div className="flex-1 flex flex-col glass">
                        {/* 消息列表 */}
                        <div className="flex-1 overflow-y-auto p-6">
                            {messages.length === 0 ? (
                                <div className="h-full flex items-center justify-center">
                                    <div className="text-center max-w-md">
                                        <div className="w-20 h-20 mx-auto mb-6 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center text-white text-4xl shadow-2xl animate-float">
                                            <i className="ri-brain-line"></i>
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-900 mb-3">
                                            欢迎使用 智 OC
                                        </h2>
                                        <p className="text-gray-600 mb-6">
                                            智能运维助手，随时为您服务
                                        </p>
                                        <div className="grid grid-cols-2 gap-3 text-left">
                                            <div className="p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors cursor-pointer">
                                                <div className="text-sm font-semibold text-blue-900 mb-1">
                                                    <i className="ri-question-line mr-1"></i>
                                                    查询备份状态
                                                </div>
                                                <div className="text-xs text-blue-700">
                                                    "查询站点 A 的备份作业"
                                                </div>
                                            </div>
                                            <div className="p-4 bg-green-50 rounded-lg hover:bg-green-100 transition-colors cursor-pointer">
                                                <div className="text-sm font-semibold text-green-900 mb-1">
                                                    <i className="ri-server-line mr-1"></i>
                                                    检查主机健康
                                                </div>
                                                <div className="text-xs text-green-700">
                                                    "检查主机 192.168.1.1"
                                                </div>
                                            </div>
                                            <div className="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors cursor-pointer">
                                                <div className="text-sm font-semibold text-purple-900 mb-1">
                                                    <i className="ri-global-line mr-1"></i>
                                                    网络连通性测试
                                                </div>
                                                <div className="text-xs text-purple-700">
                                                    "Ping 测试 10.1.1.1"
                                                </div>
                                            </div>
                                            <div className="p-4 bg-orange-50 rounded-lg hover:bg-orange-100 transition-colors cursor-pointer">
                                                <div className="text-sm font-semibold text-orange-900 mb-1">
                                                    <i className="ri-file-list-3-line mr-1"></i>
                                                    查看系统资源
                                                </div>
                                                <div className="text-xs text-orange-700">
                                                    "查看服务器资源使用情况"
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {messages.map((msg, idx) => (
                                        <div
                                            key={idx}
                                            className={`message-bubble ${
                                                msg.role === 'user' ? 'message-user' : 'message-assistant'
                                            }`}
                                        >
                                            {msg.error && (
                                                <div className="flex items-center gap-2 text-red-600 mb-2">
                                                    <i className="ri-error-warning-line"></i>
                                                    <span className="font-semibold">错误</span>
                                                </div>
                                            )}
                                            <div className="markdown-body">
                                                {msg.content}
                                            </div>
                                            <div className={`text-xs mt-2 ${
                                                msg.role === 'user' ? 'text-blue-100' : 'text-gray-400'
                                            }`}>
                                                {new Date(msg.timestamp).toLocaleString('zh-CN')}
                                            </div>
                                        </div>
                                    ))}
                                    {loading && (
                                        <div className="message-bubble message-assistant">
                                            <div className="typing-indicator">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>
                            )}
                        </div>
                        
                        {/* 输入区域 */}
                        <div className="input-area border-t border-gray-200">
                            <textarea
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="输入您的问题..."
                                className="input-field-chat"
                                rows="1"
                                disabled={loading}
                            />
                            <button
                                onClick={sendMessage}
                                disabled={loading || !input.trim()}
                                className="btn-send"
                            >
                                <i className="ri-send-plane-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        // ═══ 主应用 ═══
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                const saved = localStorage.getItem('zops_user');
                if (saved) {
                    setUser(JSON.parse(saved));
                }
                setLoading(false);
            }, []);
            
            const handleLogin = (userData) => {
                setUser(userData);
            };
            
            const handleLogout = () => {
                localStorage.removeItem('zops_user');
                setUser(null);
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="loading-spinner" style={{ border: '3px solid #e5e7eb', borderTopColor: '#3b82f6' }}></div>
                            <div className="text-gray-600 mt-4">加载中...</div>
                        </div>
                    </div>
                );
            }
            
            return user ? (
                <MainApp user={user} onLogout={handleLogout} />
            ) : (
                <LoginPage onLogin={handleLogin} />
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
