// ─── 数据脱敏配置 ───
function AdminSanitize() {
    const [mappings, setMappings] = useState({});
    const [nmk, setNmk] = useState('');
    const [nmv, setNmv] = useState('');
    const [testText, setTestText] = useState('');
    const [testResult, setTestResult] = useState(null);

    useEffect(() => { API.get('/api/sanitize/mappings').then(d => setMappings(d.mappings || {})).catch(() => {}); }, []);

    const addMap = () => { if (!nmk.trim() || !nmv.trim()) return; const u = { ...mappings, [nmk]: nmv }; setMappings(u); API.post('/api/sanitize/mappings', { mappings: u }); setNmk(''); setNmv(''); };
    const rmMap = (k) => { const u = { ...mappings }; delete u[k]; setMappings(u); API.post('/api/sanitize/mappings', { mappings: u }); };
    const runTest = async () => { if (!testText.trim()) return; try { const r = await API.post('/api/sanitize/test', { text: testText }); setTestResult(await r.json()); } catch (e) { setTestResult({ error: e.message }); } };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';
    const lbl = 'block text-sm font-medium text-gray-700 mb-1.5';

    return (
        <div className="max-w-2xl">
            <h3 className="text-gray-900 font-semibold text-base mb-4">数据脱敏配置</h3>
            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm mb-4">
                <p className="text-xs text-gray-400 mb-4">内置规则自动识别内网IP、MAC、密码、API Key、域名、邮箱、手机号等。</p>
                <div className="mb-4"><label className={lbl}>自定义映射</label>
                    <div className="space-y-2 mb-2">{Object.entries(mappings).map(([k, v]) => (
                        <div key={k} className="flex items-center gap-2 text-sm bg-gray-50 rounded-lg px-3 py-2">
                            <code className="text-red-600">{k}</code><span className="text-gray-300">→</span><code className="text-green-600">{v}</code>
                            <button onClick={() => rmMap(k)} className="text-gray-300 hover:text-red-400 ml-auto"><i className="ri-close-line" /></button></div>))}</div>
                    <div className="flex gap-2"><input type="text" placeholder="真实值" value={nmk} onChange={e => setNmk(e.target.value)} className={inp + ' flex-1'} />
                        <input type="text" placeholder="替代值" value={nmv} onChange={e => setNmv(e.target.value)} className={inp + ' flex-1'} />
                        <button onClick={addMap} className="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm border border-gray-200"><i className="ri-add-line" /></button></div></div>
                <div><label className={lbl}>脱敏测试</label>
                    <div className="flex gap-2 mb-2"><textarea value={testText} onChange={e => setTestText(e.target.value)} placeholder="粘贴文本测试..." className={inp + ' flex-1'} rows={2} />
                        <button onClick={runTest} className="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm self-end shadow-sm font-medium">测试</button></div>
                    {testResult && !testResult.error && <div className="bg-gray-50 rounded-lg p-3 text-sm border border-gray-200">
                        <div className="text-green-600 font-medium mb-1 text-xs">{testResult.summary}</div>
                        <div className="text-gray-700 font-mono text-xs whitespace-pre-wrap">{testResult.masked_text}</div></div>}</div>
            </div>
        </div>
    );
}

// ─── API Keys ───
function AdminOneAPIKeys() {
    const [keys, setKeys] = useState([]);
    const [newName, setNewName] = useState('');
    const [creating, setCreating] = useState(false);
    const [newKey, setNewKey] = useState(null);
    const [copied, setCopied] = useState(false);

    const load = () => API.get('/api/oneapi/keys').then(d => setKeys(d.keys || [])).catch(() => {});
    useEffect(() => { load(); }, []);

    const createKey = async () => {
        if (!newName.trim()) return;
        setCreating(true);
        try {
            const r = await API.post('/api/oneapi/keys', { name: newName.trim() });
            const d = await r.json();
            if (d.key) { setNewKey(d); setNewName(''); load(); }
        } catch (e) { alert('创建失败: ' + (e.message || e)); }
        setCreating(false);
    };

    const deleteKey = async (id) => {
        if (!confirm('确认删除该 Key？删除后使用该 Key 的外部应用将无法访问。')) return;
        try { await API.del('/api/oneapi/keys/' + encodeURIComponent(id)); load(); } catch (e) {}
    };

    const copyKey = () => { navigator.clipboard.writeText(newKey.key).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }); };

    const inp = 'w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent';
    const port = location.port || (location.protocol === 'https:' ? '443' : '80');
    const baseUrl = `${location.protocol}//${location.hostname}:${port}/v1`;

    return (
        <div className="max-w-3xl">
            <h3 className="text-gray-900 font-semibold text-base mb-1">API Keys</h3>
            <p className="text-xs text-gray-400 mb-4">仅显示平台为你创建的 <code className="text-blue-500">oneapi:*</code> token。可用于外部 Chatbox / OpenWebUI 等直接调用。</p>

            {newKey && <div className="mb-4 bg-green-50 border border-green-200 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-2"><i className="ri-check-line text-green-600" /><span className="text-sm font-medium text-green-800">Key 创建成功</span></div>
                <p className="text-xs text-green-700 mb-2">请立即复制保存，关闭后将无法再次查看完整 Key。</p>
                <div className="flex items-center gap-2 bg-white rounded-lg border border-green-200 px-3 py-2">
                    <code className="flex-1 text-xs font-mono text-gray-800 break-all select-all">{newKey.key}</code>
                    <button onClick={copyKey} className="shrink-0 text-green-600 hover:text-green-800 text-sm">
                        <i className={copied ? 'ri-check-double-line' : 'ri-file-copy-line'} /> {copied ? '已复制' : '复制'}
                    </button>
                </div>
                <div className="mt-2 text-xs text-gray-500">Label: <code>{newKey.label}</code> · Id: <code>{newKey.id}</code></div>
            </div>}

            <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm mb-4">
                <div className="flex gap-2 mb-4">
                    <input type="text" placeholder="名称 (如: svc-opscore)，生成 Label 为 oneapi:名称" value={newName} onChange={e => setNewName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && createKey()} className={inp + ' flex-1'} />
                    <button onClick={createKey} disabled={creating || !newName.trim()}
                        className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm whitespace-nowrap">
                        <i className="ri-add-line mr-1" />{creating ? '创建中...' : '创建 Key'}
                    </button>
                </div>

                {keys.length === 0 ? (
                    <div className="text-center py-8 text-gray-300">
                        <i className="ri-key-2-line text-3xl" />
                        <p className="text-sm mt-2">暂无 Key，创建一个开始使用</p>
                    </div>
                ) : (
                    <table className="w-full text-sm">
                        <thead><tr className="text-left text-xs text-gray-400 border-b border-gray-100">
                            <th className="py-2 font-medium">Label</th>
                            <th className="py-2 font-medium">Key</th>
                            <th className="py-2 font-medium">Id</th>
                            <th className="py-2 w-10">Action</th>
                        </tr></thead>
                        <tbody>{keys.map(k => (
                            <tr key={k.id} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                                <td className="py-2.5"><code className="text-sm font-medium text-gray-800">{k.label}</code></td>
                                <td className="py-2.5"><code className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded font-mono">{k.key}</code></td>
                                <td className="py-2.5"><code className="text-xs text-gray-400 font-mono">{k.id}</code></td>
                                <td className="py-2.5"><button onClick={() => deleteKey(k.id)} className="text-gray-300 hover:text-red-500 transition-colors" title="删除"><i className="ri-delete-bin-line" /></button></td>
                            </tr>
                        ))}</tbody>
                    </table>
                )}
            </div>

            <div className="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <h4 className="text-xs font-medium text-gray-600 mb-2"><i className="ri-terminal-box-line mr-1" />外部工具配置</h4>
                <div className="space-y-1.5 text-xs">
                    <div className="flex items-center gap-2"><span className="text-gray-400 w-16">API Base</span><code className="bg-white border border-gray-200 rounded px-2 py-0.5 text-gray-700 font-mono">{baseUrl}</code></div>
                    <div className="flex items-center gap-2"><span className="text-gray-400 w-16">API Key</span><code className="bg-white border border-gray-200 rounded px-2 py-0.5 text-gray-700 font-mono">← 上方创建的 Key</code></div>
                    <div className="flex items-center gap-2"><span className="text-gray-400 w-16">Model</span><code className="bg-white border border-gray-200 rounded px-2 py-0.5 text-gray-700 font-mono">zops-agent</code></div>
                </div>
                <p className="text-xs text-gray-400 mt-2">在 Chatbox / OpenWebUI / Cherry Studio 中配置以上信息即可直接调用 Z-OPS 智能体。</p>
            </div>
        </div>
    );
}

// ─── 用户操作日志 (审计用) ───
function AdminUserOps() {
    const [entries, setEntries] = useState([]);
    const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
    const [fUser, setFUser] = useState('');
    const [autoR, setAutoR] = useState(true);

    const load = useCallback(() => {
        const p = new URLSearchParams({ date, count: '300' });
        if (fUser) p.set('username', fUser);
        API.get(`/api/user-ops?${p}`).then(d => setEntries(d.entries || [])).catch(() => {});
    }, [date, fUser]);
    useEffect(() => { load(); }, [load]);
    useEffect(() => { if (!autoR) return; const t = setInterval(load, 8000); return () => clearInterval(t); }, [autoR, load]);

    const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString('zh-CN') : '-';
    const allUsers = [...new Set(entries.map(e => e.username).filter(Boolean))];
    const actionIcon = { login: 'ri-login-box-line', llm_config: 'ri-brain-line', create_api_key: 'ri-key-2-line', delete_api_key: 'ri-delete-bin-line', agent_model: 'ri-cpu-line' };
    const actionColor = { login: 'text-green-600 bg-green-50', llm_config: 'text-purple-600 bg-purple-50', create_api_key: 'text-blue-600 bg-blue-50', delete_api_key: 'text-red-600 bg-red-50', agent_model: 'text-orange-600 bg-orange-50' };
    const chip = (active) => `px-2.5 py-1 rounded-full text-xs cursor-pointer transition-all border ${active ? 'bg-blue-50 border-blue-300 text-blue-700 font-medium' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-300'}`;

    return (
        <div className="max-w-4xl">
            <div className="flex items-center justify-between mb-4">
                <div><h3 className="text-gray-900 font-semibold text-base">用户操作日志</h3>
                    <p className="text-gray-400 text-xs mt-0.5">{entries.length} 条记录，登录/配置变更/Key管理等操作审计</p></div>
                <div className="flex items-center gap-2">
                    <button onClick={() => setAutoR(!autoR)} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border transition-all ${autoR ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-400'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${autoR ? 'bg-green-500 animate-pulse' : 'bg-gray-300'}`} />{autoR ? '刷新中' : '已暂停'}
                    </button>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-xs text-gray-700" />
                </div>
            </div>
            {/* 用户过滤 */}
            <div className="flex flex-wrap gap-1.5 mb-4">
                <span onClick={() => setFUser('')} className={chip(!fUser)}>全部</span>
                {allUsers.map(u => <span key={u} onClick={() => setFUser(fUser === u ? '' : u)} className={chip(fUser === u)}><i className="ri-user-line mr-0.5" />{u}</span>)}
            </div>
            {/* 操作列表 */}
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="divide-y divide-gray-50 max-h-[60vh] overflow-y-auto">
                    {entries.slice().reverse().map((e, i) => {
                        const ac = actionColor[e.action] || 'text-gray-600 bg-gray-50';
                        const ai = actionIcon[e.action] || 'ri-arrow-right-line';
                        return (
                            <div key={i} className="px-4 py-3 text-sm hover:bg-gray-50 transition-colors">
                                <div className="flex items-center gap-2">
                                    <span className={`inline-flex items-center gap-1 text-[10px] font-medium px-1.5 py-0.5 rounded-full ${ac}`}><i className={ai} />{e.action}</span>
                                    <span className="text-gray-800 font-medium text-xs"><i className="ri-user-line mr-0.5 text-gray-400" />{e.username}</span>
                                    {e.ip && <span className="text-[10px] text-gray-400">{e.ip}</span>}
                                    <span className="ml-auto text-[10px] text-gray-400">{fmtTime(e.timestamp)}</span>
                                </div>
                                {e.detail && <div className="text-gray-500 text-xs pl-4 mt-0.5 truncate">{e.detail}</div>}
                            </div>
                        );
                    })}
                    {entries.length === 0 && <div className="text-center text-gray-400 py-16"><i className="ri-history-line text-4xl block mb-3 text-gray-300" /><p>暂无操作记录</p></div>}
                </div>
            </div>
        </div>
    );
}

// ═══ App ═══
function App() {
    const [user, setUser] = useState(null);
    const [tab, setTab] = useState('chat');
    const [overview, setOverview] = useState(null);

    // 检查已有 token
    useEffect(() => {
        const stored = localStorage.getItem('zops_user');
        if (stored && API.token) {
            try {
                setUser(JSON.parse(stored));
                // 验证 token 有效性
                API.get('/api/auth/me').then(d => setUser(d)).catch(() => { API.logout(); setUser(null); });
            } catch(e) { API.logout(); }
        }
    }, []);

    useEffect(() => {
        if (!user) return;
        const f = () => API.get('/api/overview').then(setOverview).catch(() => {});
        f(); const t = setInterval(f, 10000); return () => clearInterval(t);
    }, [user]);

    const handleLogin = (data) => { setUser({ username: data.username, display_name: data.display_name, role: data.role }); };
    const handleLogout = () => { API.logout(); setUser(null); setOverview(null); };

    if (!user) return <LoginPage onLogin={handleLogin} />;

    return (
        <div className="flex flex-col h-screen bg-gray-50">
            <Header user={user} overview={overview} onLogout={handleLogout} />
            <div className="flex flex-1 overflow-hidden">
                <Sidebar user={user} activeTab={tab} setActiveTab={setTab} />
                <main className="flex-1 overflow-hidden">
                    {tab === 'chat' && <ChatPanel user={user} />}
                    {tab === 'agents' && <AgentsPanel overview={overview} user={user} />}
                    {tab === 'logs' && user?.role === 'admin' && <LogsPanel />}
                    {tab === 'usage' && user?.role === 'admin' && <UsagePanel />}
                    {tab === 'admin' && user?.role === 'admin' && <AdminPanel overview={overview} user={user} />}
                    {tab === 'n8n' && user?.role === 'admin' && <N8nPanel />}
                </main>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
